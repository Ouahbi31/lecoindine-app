<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-itunes-app" content="app-id=6476780044">
  <title>Lecoindine – Télécharger l'application</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f0e8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 360px;
      width: 90%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .logo { font-size: 48px; margin-bottom: 12px; }
    h1 { font-size: 22px; color: #1a1a1a; margin-bottom: 6px; }
    p { font-size: 14px; color: #777; margin-bottom: 32px; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 12px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-ios { background: #000; color: #fff; }
    .btn-android { background: #01875f; color: #fff; }
    .btn svg { width: 20px; height: 20px; fill: white; flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🛍️</div>
    <h1>Lecoindine</h1>
    <p>Le marché éthique</p>

    <a class="btn btn-ios" href="itms-apps://apps.apple.com/fr/app/lecoindine-le-march%C3%A9-%C3%A9thique/id6476780044" onclick="handleIOS(event)">
      <svg viewBox="0 0 814 1000"><path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105-57.8-155.5-127.4C46 376.7 0 248.7 0 126.8 0 56.5 23.2 23.6 73.5 23.6c38.8 0 80.3 21.9 115.5 21.9 33.5 0 90.2-26.9 138.4-26.9 32 0 134.6 2.6 198.2 109.2zm-234-181.5c31.1-36.9 53.1-88.1 53.1-139.3 0-7.1-.6-14.3-1.9-20.1-50.6 1.9-110.8 33.7-147.1 75.8-28.5 32-53.8 83.2-53.8 135.6 0 7.8 1.3 15.6 1.9 18.1 3.2.6 8.4 1.3 13.6 1.3 45.4 0 102.5-30.4 134.2-71.4z"/></svg>
      App Store (iPhone)
    </a>

    <a class="btn btn-android" href="market://details?id=com.orcsys.lecoindine" onclick="handleAndroid(event)">
      <svg viewBox="0 0 24 24"><path d="M3.18 23.76a2 2 0 0 1-1.04-1.76V2a2 2 0 0 1 1.04-1.76l11.33 11.76-11.33 11.76zm13.09-8.54-2.35-2.44 2.35-2.44 2.61 1.51a1.5 1.5 0 0 1 0 2.62l-2.61 1.75zm-14.1 8.1 10.3-10.7-2.35-2.44L.17 21.3a2 2 0 0 0 1.99.02zM1.17 2.7l9.94 10.32 2.35-2.44L2.16 0A2 2 0 0 0 1.17 2.7z"/></svg>
      Google Play (Android)
    </a>
  </div>

  <script>
    var IOS_URL = "https://apps.apple.com/fr/app/lecoindine-le-march%C3%A9-%C3%A9thique/id6476780044";
    var ANDROID_URL = "https://play.google.com/store/apps/details?id=com.orcsys.lecoindine";

    function handleIOS(e) {
      e.preventDefault();
      var a = document.createElement('a');
      a.href = IOS_URL;
      a.target = '_blank';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function handleAndroid(e) {
      e.preventDefault();
      var a = document.createElement('a');
      a.href = ANDROID_URL;
      a.target = '_blank';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  </script>
</body>
</html>
